<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0a">
<title>House Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    padding: 16px;
    padding-bottom: 80px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    color: #fff;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  h1 span { color: #4dd0e1; }

  /* Sync status */
  .sync-row {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    margin-bottom: 18px;
  }
  .sync-pill {
    font-size: 11px; color: #999;
    background: #1e1e1e; padding: 4px 12px; border-radius: 20px; border: 1px solid #333;
    display: flex; align-items: center; gap: 6px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #69f0ae; }
  .sync-pill.syncing .sync-dot { background: #ffd740; }
  .sync-pill.offline .sync-dot { background: #ff5252; }
  .sync-pill.local .sync-dot { background: #888; }
  .refresh-btn {
    font-size: 11px; color: #4dd0e1; background: none;
    border: 1px solid #4dd0e1; border-radius: 20px; padding: 4px 12px; cursor: pointer;
  }
  .refresh-btn:active { background: #4dd0e133; }

  /* List card */
  .list-card {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .list-header {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .list-header .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .list-header h2 { font-size: 16px; flex: 1; font-weight: 600; color: #fff; }
  .list-header .count {
    font-size: 11px; color: #999; background: #1e1e1e;
    padding: 3px 10px; border-radius: 20px; border: 1px solid #333;
  }
  .list-header .arrow { font-size: 13px; color: #555; transition: transform 0.3s; }
  .list-header.open .arrow { transform: rotate(180deg); }
  .list-del {
    font-size: 13px; color: #555; background: none; border: none;
    cursor: pointer; padding: 4px 6px; flex-shrink: 0;
  }
  .list-del:active { color: #ff5252; }
  .list-body { display: none; padding: 0 12px 12px; }
  .list-body.open { display: block; }

  /* Item row */
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px solid #1c1c1c;
  }
  .item:last-of-type { border-bottom: none; }
  .check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #444; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
    transition: all 0.15s;
  }
  .item.done .check { background: #69f0ae; border-color: #69f0ae; color: #0a0a0a; }
  .item-text { flex: 1; font-size: 15px; color: #e0e0e0; word-break: break-word; }
  .item.done .item-text { color: #666; text-decoration: line-through; }
  .item-text-input {
    flex: 1; font-size: 15px; color: #fff; background: #1e1e1e;
    border: 1px solid #4dd0e1; border-radius: 8px; padding: 6px 8px; outline: none;
    font-family: inherit;
  }
  .chip {
    font-size: 10px; padding: 3px 8px; border-radius: 12px;
    background: #1e1e1e; border: 1px solid #333; color: #999; flex-shrink: 0;
  }
  .chip.due { color: #ffd740; border-color: #ffd74055; }
  .chip.overdue { color: #ff5252; border-color: #ff525255; }
  .chip.who { color: #4dd0e1; border-color: #4dd0e144; }
  .item-btn {
    background: none; border: none; cursor: pointer; font-size: 14px;
    color: #555; padding: 4px; flex-shrink: 0;
  }
  .item-btn:active { color: #4dd0e1; }
  .item-del:active { color: #ff5252; }

  /* Add item */
  .add-row { display: flex; gap: 8px; padding: 10px 4px 2px; }
  .add-input {
    flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 11px 12px; color: #fff; font-size: 15px; outline: none; font-family: inherit;
  }
  .add-input:focus { border-color: #4dd0e1; }
  .add-input::placeholder { color: #555; }
  .add-btn {
    background: #4dd0e1; color: #0a0a0a; border: none; border-radius: 10px;
    padding: 0 16px; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .add-btn:active { opacity: 0.8; }

  .clear-done {
    font-size: 11px; color: #999; background: none; border: 1px solid #333;
    border-radius: 20px; padding: 4px 12px; cursor: pointer; margin: 8px 4px 2px;
  }
  .clear-done:active { color: #ff5252; border-color: #ff5252; }

  /* New list */
  .new-list-btn {
    width: 100%; background: #141414; border: 1px dashed #333; border-radius: 14px;
    padding: 15px; color: #4dd0e1; font-size: 15px; cursor: pointer; margin-bottom: 12px;
  }
  .new-list-btn:active { background: #1a1a1a; }
  .new-list-form {
    background: #141414; border: 1px solid #4dd0e1; border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .new-list-form input {
    width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 11px 12px; color: #fff; font-size: 15px; outline: none; font-family: inherit;
    margin-bottom: 10px;
  }
  .swatches { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.sel { border-color: #fff; }
  .form-row { display: flex; gap: 8px; }
  .form-row button {
    flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; cursor: pointer; border: none;
  }
  .btn-primary { background: #4dd0e1; color: #0a0a0a; font-weight: 700; }
  .btn-ghost { background: #1e1e1e; color: #999; border: 1px solid #333 !important; }


  /* Mobile tuning */
  @media (max-width: 480px) {
    body { padding: 12px; padding-bottom: 70px; }
    h1 { font-size: 18px; }
    .tab { font-size: 13px; padding: 10px 4px; }
    .list-header h2 { font-size: 15px; }
    .item { flex-wrap: wrap; }
    .item-text { flex-basis: 100%; min-width: 0; margin-bottom: 6px; word-break: normal; overflow-wrap: break-word; }
    .item-text-input { flex-basis: 100%; }
    .chip { font-size: 10px; }
    .billpay { padding: 7px 10px; font-size: 11px; }
    .ev-row { flex-direction: column; align-items: stretch; gap: 4px; }
    .ev-row label { width: auto; }
    .seg-btn { min-width: 0; font-size: 11px; padding: 9px 2px; }
    .cal-num { font-size: 12px; }
    .cal-day { border-radius: 7px; }
    .day-title { font-size: 13px; }
  }

  /* Tab bar */
  .tabbar { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .tab {
    flex: 1; max-width: 180px; padding: 10px; border-radius: 12px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: 1px solid #2a2a2a; background: #141414; color: #888;
  }
  .tab.sel { background: #4dd0e1; color: #0a0a0a; border-color: #4dd0e1; }

  /* Bills */
  .billpay {
    background: #69f0ae; color: #0a0a0a; border: none; border-radius: 10px;
    padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  .billpay.undo { background: #1e1e1e; color: #69f0ae; border: 1px solid #69f0ae44; }

  /* Meals */
  .meal-table {
    display: grid; grid-template-columns: 52px 1fr 1fr; gap: 8px;
    background: #141414; border: 1px solid #2a2a2a; border-radius: 14px; padding: 14px;
  }
  .mt-head { font-size: 13px; color: #888; text-align: center; font-weight: 700; padding-bottom: 4px; }
  .mt-day { font-size: 14px; font-weight: 700; color: #ccc; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px; }
  .mt-day.today { color: #4dd0e1; }
  .mt-input {
    width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 13px 10px; color: #fff; font-size: 15px; outline: none; font-family: inherit;
  }
  .mt-input:focus { border-color: #4dd0e1; }
  .meal-picker { margin-top: 10px; background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #888; }
  .mp-chip { background: #1e1e1e; border: 1px solid #333; color: #ccc; border-radius: 14px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .mp-chip.sel { background: #4dd0e1; color: #0a0a0a; border-color: #4dd0e1; font-weight: 700; }
  .mp-apply { background: #69f0ae; color: #0a0a0a; border: none; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .mp-apply:disabled { opacity: 0.35; cursor: default; }
  .meal-clear { display: block; margin: 12px auto 0; background: none; border: 1px solid #5a2a2a; color: #ef9a9a; border-radius: 10px; padding: 8px 16px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .meal-clear.armed { background: #b71c1c; color: #fff; border-color: #b71c1c; font-weight: 700; }

  /* Calendar */
  .cal-card {
    background: #141414; border: 1px solid #2a2a2a; border-radius: 14px;
    margin-bottom: 12px; overflow: hidden; padding: 12px;
  }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav button {
    background: #1e1e1e; border: 1px solid #333; color: #4dd0e1; border-radius: 10px;
    width: 38px; height: 34px; font-size: 18px; cursor: pointer;
  }
  .cal-nav div { color: #fff; font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 10px; color: #555; padding: 4px 0; font-weight: 700; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 9px; cursor: pointer; background: #1a1a1a; padding: 2px 0;
  }
  .cal-day:active { background: #252525; }
  .cal-day.blank { background: none; cursor: default; }
  .cal-day.today { border: 1px solid #4dd0e1; }
  .cal-day.sel { background: #4dd0e133; border: 1px solid #4dd0e1; }
  .cal-num { font-size: 13px; color: #ccc; }
  .cal-day.today .cal-num { color: #4dd0e1; font-weight: 700; }
  .cal-dots { display: flex; gap: 2px; height: 6px; margin-top: 2px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .day-title { color: #fff; font-size: 14px; font-weight: 600; margin: 4px 2px 8px; }

  .ev-emoji { font-size: 17px; width: 26px; text-align: center; flex-shrink: 0; }
  .ev-when { font-size: 11px; color: #888; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .seg-btn {
    flex: 1; min-width: 70px; padding: 9px 4px; border-radius: 10px; font-size: 12px;
    cursor: pointer; border: 1px solid #333; background: #1e1e1e; color: #999; font-weight: 600;
  }
  .seg-btn.sel { background: #4dd0e1; color: #0a0a0a; border-color: #4dd0e1; }
  .ev-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ev-row label { font-size: 12px; color: #888; width: 90px; flex-shrink: 0; }
  .ev-row input {
    flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 10px 12px; color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  .chip.bday { color: #ff80ab; border-color: #ff80ab44; }
  .chip.rem { color: #ffd740; border-color: #ffd74044; }

  /* Who prompt */
  .who-overlay {
    position: fixed; inset: 0; background: #000000d9; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .who-card {
    background: #141414; border: 1px solid #2a2a2a; border-radius: 16px;
    padding: 24px; width: 100%; max-width: 320px; text-align: center;
  }
  .who-card h3 { color: #fff; font-size: 17px; margin-bottom: 6px; }
  .who-card p { color: #888; font-size: 13px; margin-bottom: 18px; }
  .who-card input {
    width: 100%; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 12px; color: #fff; font-size: 15px; outline: none; font-family: inherit;
    margin-bottom: 14px; text-align: center;
  }
  .who-btns { display: flex; gap: 10px; }
  .who-btns button {
    flex: 1; padding: 13px; border-radius: 10px; border: none; font-size: 15px;
    font-weight: 600; cursor: pointer; background: #4dd0e1; color: #0a0a0a;
  }
  .who-btns button.alt { background: #b388ff; }
  .who-btns button.other { background: #1e1e1e; color: #ccc; border: 1px solid #333 !important; }

  .empty-hint { color: #555; font-size: 13px; text-align: center; padding: 12px 0 4px; }
  .foot {
    text-align: center; color: #444; font-size: 11px; margin-top: 18px; line-height: 1.6;
  }
  .hidden-date { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
</style>
</head>
<body>

<h1>🏠 <span>House Board</span></h1>
<div class="sync-row">
  <div class="sync-pill" id="syncPill"><div class="sync-dot"></div><span id="syncText">starting…</span></div>
  <button class="refresh-btn" id="refreshBtn">refresh</button>
</div>

<div class="tabbar">
  <button id="tabLists" class="tab sel">📝 Lists</button>
  <button id="tabMeals" class="tab">🍽 Meals</button>
  <button id="tabCal" class="tab">📅 Calendar</button>
</div>

<div id="listsView">
<div id="lists"></div>

<button class="new-list-btn" id="newListBtn">+ New list</button>
<div class="new-list-form" id="newListForm" style="display:none">
  <input id="newListName" placeholder="List name, e.g. Weekend plans" maxlength="40">
  <div class="swatches" id="swatches"></div>
  <div class="form-row">
    <button class="btn-ghost" id="cancelListBtn">Cancel</button>
    <button class="btn-primary" id="createListBtn">Create list</button>
  </div>
</div>
</div>

<div id="mealsView" style="display:none">
  <div id="meals"></div>
  <div id="mealPicker" style="display:none"></div>
  <div class="empty-hint">Tap a meal to edit - saves by itself. While a meal is selected, use the day buttons below to add it to other days too.</div>
  <button class="meal-clear" id="clearMealsBtn">Clear week</button>
</div>

<div id="calView" style="display:none">
  <div class="cal-card">
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <div id="calMonthLabel"></div>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div id="dayEvents"></div>
  <div class="cal-card" style="padding:4px 12px">
    <div class="day-title" style="margin:8px 2px">Bills this month</div>
    <div id="bills"></div>
    <button class="new-list-btn" id="newBillBtn" style="margin:8px 0 4px">+ Add bill (levy, WiFi, insurance...)</button>
    <div class="new-list-form" id="newBillForm" style="display:none">
      <input id="billName" placeholder="Bill name, e.g. Levy" maxlength="40">
      <div class="ev-row"><label>Amount R (optional)</label><input type="number" id="billAmount" min="0" step="any" placeholder="1500"></div>
      <div class="ev-row"><label>Due day of month</label><input type="number" id="billDay" min="1" max="31" placeholder="1"></div>
      <div class="ev-row"><label>Auto-pay (debit order)</label><input type="checkbox" id="billAuto" style="width:auto;flex:0"></div>
      <div class="form-row">
        <button class="btn-ghost" id="cancelBillBtn">Cancel</button>
        <button class="btn-primary" id="saveBillBtn">Add</button>
      </div>
    </div>
    <div class="empty-hint">Paid ticks reset automatically each month.</div>
  </div>
  <div class="cal-card">
    <div class="day-title" style="margin-top:0">Coming up</div>
    <div id="upcoming"></div>
  </div>
  <button class="new-list-btn" id="newEventBtn">+ Add event / birthday / reminder</button>
  <div class="new-list-form" id="newEventForm" style="display:none">
    <input id="evTitle" placeholder="Title, e.g. Jade's birthday" maxlength="60">
    <div class="ev-row"><label>Date</label><input type="date" id="evDate"></div>
    <div class="ev-row"><label>Time (optional)</label><input type="time" id="evTime"></div>
    <div class="seg" id="evTypeSeg"></div>
    <div class="seg" id="evRepeatSeg"></div>
    <div class="form-row">
      <button class="btn-ghost" id="cancelEventBtn">Cancel</button>
      <button class="btn-primary" id="createEventBtn">Add</button>
    </div>
  </div>
</div>

<div class="foot" id="foot"></div>

<div class="who-overlay" id="whoOverlay" style="display:none">
  <div class="who-card">
    <h3>Whose phone is this?</h3>
    <p>So we can see who added what. Only asked once.</p>
    <div class="who-btns">
      <button id="whoGreg">Greg</button>
      <button class="alt" id="whoJade">Jade</button>
    </div>
  </div>
</div>

<input type="date" class="hidden-date" id="hiddenDate">

<script>
'use strict';
/* ================= CONFIG ================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyLuzcCFalgU7vBVcee-6vMjhakvwt15jeQS4xFHQ3gq9hDnTyNEtc-w2B1Y21KSQhD/exec'; // shared store endpoint; empty string = local-only mode
const POLL_MS = 15000;
/* ========================================== */

const COLORS = ['#4dd0e1','#b388ff','#69f0ae','#ffab40','#ff80ab','#448aff','#ffd740','#ff5252'];
const LS_KEY = 'houseboard.v1';
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const EVTYPES = {
  event:    {emoji: '\ud83d\udcc5', color: '#4dd0e1', label: 'Event'},
  birthday: {emoji: '\ud83c\udf82', color: '#ff80ab', label: 'Birthday'},
  reminder: {emoji: '\u23f0',        color: '#ffd740', label: 'Reminder'}
};
const REPEATS = [['none','Once'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']];

let state = null;          // {board, version, who, open:{listId:true}}
let saveTimer = null, pushing = false, pushAgain = false, renderDeferred = false;

/* ---------- persistence (local) ---------- */
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch(e) { return null; }
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({board: state.board, version: state.version, who: state.who})); } catch(e) {}
}

/* ---------- seed ---------- */
function seedEvents() {
  return [
    { id: uid(), title: "Greg's birthday", type: 'birthday', date: '2001-05-25', time: null, repeat: 'yearly', addedBy: 'Instinct', ts: Date.now() }
  ];
}
function seedBoard() {
  const today = new Date();
  const pay = new Date(today.getFullYear(), today.getMonth(), 25);
  if (pay < today) pay.setMonth(pay.getMonth() + 1);
  const dday = new Date(today.getFullYear(), today.getMonth(), 15);
  if (dday < today) dday.setMonth(dday.getMonth() + 1);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  return { lists: [
    { id: uid(), name: 'Groceries', color: '#4dd0e1', items: [] },
    { id: uid(), name: 'Weekend plans', color: '#b388ff', items: [] },
    { id: uid(), name: 'Vitality D-day', color: '#ffab40', items: [
      { id: uid(), text: 'D-day shop - HealthyFood at Checkers/Woolworths', done: false, date: iso(dday), addedBy: 'Instinct', ts: Date.now() },
      { id: uid(), text: 'Compare partner prices for our usuals', done: false, date: null, addedBy: 'Instinct', ts: Date.now() }
    ]},
    { id: uid(), name: 'Home admin', color: '#69f0ae', items: [
      { id: uid(), text: 'Mampala pay day', done: false, date: iso(pay), addedBy: 'Instinct', ts: Date.now() },
      { id: uid(), text: 'License disc - renew', done: false, date: null, addedBy: 'Instinct', ts: Date.now() },
      { id: uid(), text: 'Levy - check statement', done: false, date: null, addedBy: 'Instinct', ts: Date.now() }
    ]}
  ], events: seedEvents(), bills: seedBills(), meals: seedMeals() };
}

function ensureEvents() {
  if (state.board && !state.board.events) { state.board.events = seedEvents(); saveLocal(); schedulePush(); }
}
function seedBills() {
  return [
    { id: uid(), name: 'Levy', amount: null, dueDay: 1, autoPay: true, paid: {}, addedBy: 'Instinct', ts: Date.now() }
  ];
}
function ensureBills() {
  if (state.board && !state.board.bills) { state.board.bills = seedBills(); saveLocal(); schedulePush(); }
  if (state.board && state.board.bills) {
    let changed = false;
    for (const b of state.board.bills) { if (b.autoPay === undefined) { b.autoPay = b.name === 'Levy'; changed = true; } }
    if (changed) { saveLocal(); schedulePush(); }
  }
}
function seedMeals() {
  const m = {};
  for (const d of ['mon','tue','wed','thu','fri','sat','sun']) m[d] = { lunch: '', dinner: '' };
  return m;
}
function ensureMeals() {
  if (state.board && !state.board.meals) { state.board.meals = seedMeals(); saveLocal(); schedulePush(); }
}

/* ---------- sync ---------- */
function setSync(mode, txt) {
  const pill = el('syncPill');
  pill.className = 'sync-pill' + (mode ? ' ' + mode : '');
  el('syncText').textContent = txt;
}
function fetchTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 12000);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal})).finally(() => clearTimeout(t));
}
async function apiGet() {
  const r = await fetchTimeout(API_URL + '?action=load&v=' + state.version + '&_=' + Date.now(), {method:'GET'});
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function apiPost(payload) {
  const r = await fetchTimeout(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function pull(force) {
  if (!API_URL) { setSync('local','this phone only'); return; }
  try {
    const res = await apiGet();
    if (res && res.ok) {
      if (res.unchanged) { setSync('', 'synced'); return; }
      if (typeof res.version === 'number' && res.board) {
        if (force || res.version > state.version) {
          state.board = res.board; state.version = res.version;
          ensureEvents(); ensureBills(); ensureMeals();
          saveLocal(); render();
        }
        setSync('', 'synced');
        return;
      }
    }
    throw new Error('bad response');
  } catch(e) { setSync('offline', 'offline - will retry'); }
}
function schedulePush() {
  if (!API_URL) { setSync('local','this phone only'); return; }
  setSync('syncing', 'syncing…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(push, 700);
}
async function push() {
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try {
    const res = await apiPost({action:'save', board: state.board, baseVersion: state.version, clientId: state.who || 'phone'});
    if (res && res.ok) {
      state.version = res.version; saveLocal(); setSync('', 'synced');
    } else if (res && res.conflict) {
      // server has newer state; server wins, then re-push if local changed since
      state.board = res.board; state.version = res.version; ensureEvents(); ensureBills(); ensureMeals(); saveLocal(); render();
      setSync('', 'synced');
    } else { throw new Error('bad response'); }
  } catch(e) { setSync('offline', 'offline - will retry'); }
  pushing = false;
  if (pushAgain) { pushAgain = false; schedulePush(); }
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - today) / 86400000);
}
function dateChip(it) {
  if (!it.date) return '';
  const n = daysUntil(it.date);
  let cls = 'chip', label;
  if (n < 0) { cls += ' overdue'; label = Math.abs(n) + 'd overdue'; }
  else if (n === 0) { cls += ' due'; label = 'today'; }
  else if (n === 1) { cls += ' due'; label = 'tomorrow'; }
  else { cls += ' due'; label = 'in ' + n + 'd'; }
  const pretty = new Date(it.date + 'T00:00:00').toLocaleDateString('en-ZA', {day:'numeric', month:'short'});
  return '<span class="' + cls + '" data-date="' + it.date + '">' + pretty + ' · ' + label + '</span>';
}

/* ---------- calendar ---------- */
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function evMeta(ev) { return EVTYPES[ev.type] || EVTYPES.event; }
function today0() { const t = new Date(); t.setHours(0,0,0,0); return t; }
function nextOccurrence(ev) {
  const today = today0();
  const p = ev.date.split('-').map(Number), m = p[1], d = p[2];
  if (ev.repeat === 'yearly') {
    let dt = new Date(today.getFullYear(), m - 1, d);
    if (dt < today) dt = new Date(today.getFullYear() + 1, m - 1, d);
    return dt;
  }
  if (ev.repeat === 'monthly') {
    let dt = new Date(today.getFullYear(), today.getMonth(), Math.min(d, daysInMonth(today.getFullYear(), today.getMonth())));
    if (dt < today) { const nm = new Date(today.getFullYear(), today.getMonth() + 1, 1); dt = new Date(nm.getFullYear(), nm.getMonth(), Math.min(d, daysInMonth(nm.getFullYear(), nm.getMonth()))); }
    return dt;
  }
  if (ev.repeat === 'weekly') {
    const wd = new Date(p[0], m - 1, d).getDay();
    const dt = new Date(today); dt.setDate(dt.getDate() + ((wd - dt.getDay() + 7) % 7));
    return dt;
  }
  return new Date(p[0], m - 1, d);
}
function occursOn(ev, dt) {
  const p = ev.date.split('-').map(Number), y = p[0], m = p[1], d = p[2];
  const start = new Date(y, m - 1, d);
  if (!ev.repeat || ev.repeat === 'none') return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  if (dt < start) return false;
  if (ev.repeat === 'yearly') return dt.getMonth() === m - 1 && dt.getDate() === d;
  if (ev.repeat === 'monthly') return dt.getDate() === Math.min(d, daysInMonth(dt.getFullYear(), dt.getMonth()));
  if (ev.repeat === 'weekly') return dt.getDay() === start.getDay();
  return false;
}
function evChip(occ) {
  const n = Math.round((occ - today0()) / 86400000);
  let cls = 'chip', label;
  if (n < 0) { cls += ' overdue'; label = Math.abs(n) + 'd ago'; }
  else if (n === 0) { cls += ' due'; label = 'today'; }
  else if (n === 1) { cls += ' due'; label = 'tomorrow'; }
  else { cls += ' due'; label = 'in ' + n + 'd'; }
  const pretty = occ.toLocaleDateString('en-ZA', {weekday:'short', day:'numeric', month:'short'});
  return '<span class="' + cls + '">' + pretty + ' \u00b7 ' + label + '</span>';
}
function evRow(ev, whenHtml) {
  const meta = evMeta(ev);
  let html = '<div class="item" data-ev="' + ev.id + '">';
  html += '<div class="ev-emoji">' + meta.emoji + '</div>';
  html += '<div class="item-text" data-evedit="' + ev.id + '">' + esc(ev.title) + (ev.time ? ' <span class="ev-when">\u00b7 ' + esc(ev.time) + '</span>' : '') + '</div>';
  html += whenHtml;
  if (ev.addedBy && ev.addedBy !== state.who && ev.addedBy !== 'Instinct') html += '<span class="chip who">' + esc(ev.addedBy) + '</span>';
  html += '<button class="item-btn" data-evcal="' + ev.id + '" title="Change date">\ud83d\udcc5</button>';
  html += '<button class="item-btn item-del" data-evdel="' + ev.id + '" title="Delete">\u2715</button>';
  return html + '</div>';
}
function addEvent(data) {
  if (!data.title || !data.title.trim() || !data.date) return;
  mutate(() => { state.board.events.push({ id: uid(), title: data.title.trim(), type: data.type, date: data.date, time: data.time || null, repeat: data.repeat, addedBy: state.who || '', ts: Date.now() }); });
}
function deleteEvent(id) { mutate(() => { state.board.events = state.board.events.filter(e => e.id !== id); }); }
function editEventTitle(id, text) {
  text = text.trim();
  mutate(() => { const ev = state.board.events.find(e => e.id === id); if (ev && text) ev.title = text; });
}
function setEventDate(id, dateStr) {
  mutate(() => { const ev = state.board.events.find(e => e.id === id); if (ev && dateStr) ev.date = dateStr; });
}
function renderCal() {
  const monthName = new Date(state.calY, state.calM, 1).toLocaleDateString('en-ZA', {month:'long', year:'numeric'});
  el('calMonthLabel').textContent = monthName;
  const today = today0();
  const isCurMonth = state.calY === today.getFullYear() && state.calM === today.getMonth();
  if (isCurMonth && state.calSel == null) state.calSel = today.getDate();
  const first = new Date(state.calY, state.calM, 1);
  const startCol = (first.getDay() + 6) % 7;
  const dim = daysInMonth(state.calY, state.calM);
  let html = '';
  for (const w of ['M','T','W','T','F','S','S']) html += '<div class="cal-dow">' + w + '</div>';
  for (let i = 0; i < startCol; i++) html += '<div class="cal-day blank"></div>';
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(state.calY, state.calM, d);
    const evs = state.board.events.filter(ev => occursOn(ev, dt));
    const billsOn = state.board.bills.filter(b => billOccursOn(b, dt));
    const dots = evs.map(ev => '<span class="cal-dot" style="background:' + evMeta(ev).color + '"></span>').concat(billsOn.map(() => '<span class="cal-dot" style="background:#ffab40"></span>')).slice(0, 3).join('');
    let cls = 'cal-day';
    if (dt.getTime() === today.getTime()) cls += ' today';
    if (state.calSel === d) cls += ' sel';
    html += '<div class="' + cls + '" data-day="' + d + '"><div class="cal-num">' + d + '</div><div class="cal-dots">' + dots + '</div></div>';
  }
  el('calGrid').innerHTML = html;
  // selected day events
  let dh = '';
  if (state.calSel != null) {
    const dt = new Date(state.calY, state.calM, state.calSel);
    dh += '<div class="day-title">' + dt.toLocaleDateString('en-ZA', {weekday:'long', day:'numeric', month:'long'}) + '</div>';
    const evs = state.board.events.filter(ev => occursOn(ev, dt));
    const billsOn = state.board.bills.filter(b => billOccursOn(b, dt));
    if (!evs.length && !billsOn.length) dh += '<div class="empty-hint">Nothing on this day</div>';
    for (const ev of evs) dh += evRow(ev, evChip(dt));
    for (const b of billsOn) dh += billRowHtml(b, billChip(billState(b)));
    dh += '<div style="height:10px"></div>';
  }
  el('dayEvents').innerHTML = dh;
  // upcoming
  const arr = [];
  for (const ev of state.board.events) {
    const occ = nextOccurrence(ev);
    const n = Math.round((occ - today) / 86400000);
    if ((!ev.repeat || ev.repeat === 'none') && n < 0) continue;
    arr.push({ev, occ});
  }
  for (const b of state.board.bills) arr.push({bill: b, occ: billNextOccurrence(b)});
  arr.sort((a, b) => a.occ - b.occ);
  renderBills();
  let uh = '';
  if (!arr.length) uh = '<div class="empty-hint">Nothing coming up - add events, birthdays, bills</div>';
  for (const x of arr.slice(0, 12)) uh += x.ev ? evRow(x.ev, evChip(x.occ)) : billRowHtml(x.bill, billUpcomingChip(x.bill, x.occ));
  el('upcoming').innerHTML = uh;
}

/* ---------- bills ---------- */
function monthKeyOf(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'); }
function ordinalSuffix(d) { const s = ['th','st','nd','rd'], v = d % 100; return s[(v - 20) % 10] || s[v] || s[0]; }
function billDueThisMonth(bill, ref) {
  ref = ref || today0();
  return new Date(ref.getFullYear(), ref.getMonth(), Math.min(bill.dueDay, daysInMonth(ref.getFullYear(), ref.getMonth())));
}
function billState(bill) {
  const today = today0();
  const mk = monthKeyOf(today);
  const due = billDueThisMonth(bill, today);
  const paidInfo = bill.paid && bill.paid[mk];
  return { mk, due, paid: !!paidInfo, paidInfo, autoPay: !!bill.autoPay, days: Math.round((due - today) / 86400000) };
}
function billNextOccurrence(bill) {
  const st = billState(bill);
  if (!st.paid && !bill.autoPay) return st.due;
  const nm = new Date(today0().getFullYear(), today0().getMonth() + 1, 1);
  return new Date(nm.getFullYear(), nm.getMonth(), Math.min(bill.dueDay, daysInMonth(nm.getFullYear(), nm.getMonth())));
}
function billOccursOn(bill, dt) {
  const created = new Date(bill.ts || Date.now());
  const startMonth = new Date(created.getFullYear(), created.getMonth(), 1);
  if (dt < startMonth) return false;
  return dt.getDate() === Math.min(bill.dueDay, daysInMonth(dt.getFullYear(), dt.getMonth()));
}
function billChip(st) {
  if (st.autoPay) return '<span class="chip" style="color:#b388ff;border-color:#b388ff44">auto-pay \u00b7 ' + st.due.toLocaleDateString('en-ZA', {day:'numeric', month:'short'}) + '</span>';
  if (st.paid) return '<span class="chip" style="color:#69f0ae;border-color:#69f0ae44">\u2713 paid' + (st.paidInfo && st.paidInfo.by ? ' \u00b7 ' + esc(st.paidInfo.by) : '') + '</span>';
  const n = st.days;
  let cls = 'chip', label;
  if (n < 0) { cls += ' overdue'; label = Math.abs(n) + 'd overdue'; }
  else if (n === 0) { cls += ' due'; label = 'due today'; }
  else if (n === 1) { cls += ' due'; label = 'due tomorrow'; }
  else { cls += ' due'; label = 'due in ' + n + 'd'; }
  const pretty = st.due.toLocaleDateString('en-ZA', {day:'numeric', month:'short'});
  return '<span class="' + cls + '">' + pretty + ' \u00b7 ' + label + '</span>';
}
function billUpcomingChip(b, occ) {
  const st = billState(b);
  if (st.autoPay) return '<span class="chip" style="color:#b388ff;border-color:#b388ff44">auto-pay \u00b7 ' + occ.toLocaleDateString('en-ZA', {day:'numeric', month:'short'}) + '</span>';
  if (st.paid) return '<span class="chip" style="color:#69f0ae;border-color:#69f0ae44">\u2713 paid \u00b7 next ' + occ.toLocaleDateString('en-ZA', {day:'numeric', month:'short'}) + '</span>';
  return billChip(st);
}
function billRowHtml(b, whenHtml) {
  let html = '<div class="item" data-billrow="' + b.id + '">';
  html += '<div class="ev-emoji">\ud83d\udcb3</div>';
  html += '<div class="item-text" data-billedit="' + b.id + '">' + esc(b.name) + '<span class="ev-when"> \u00b7 ' + (b.amount ? 'R' + Number(b.amount).toLocaleString('en-ZA') + ' \u00b7 ' : '') + 'due ' + b.dueDay + ordinalSuffix(b.dueDay) + '</span></div>';
  html += whenHtml || billChip(billState(b));
  const st = billState(b);
  if (!b.autoPay) html += '<button class="billpay' + (st.paid ? ' undo' : '') + '" data-billpay="' + b.id + '">' + (st.paid ? 'undo' : 'mark paid') + '</button>';
  html += '<button class="item-btn" data-billform="' + b.id + '" title="Edit">\u270e</button>';
  html += '<button class="item-btn item-del" data-billdel="' + b.id + '" title="Delete">\u2715</button>';
  return html + '</div>';
}
function addBill(d) {
  mutate(() => { state.board.bills.push({ id: uid(), name: d.name.trim(), amount: d.amount || null, dueDay: d.dueDay, autoPay: !!d.autoPay, paid: {}, addedBy: state.who || '', ts: Date.now() }); });
}
function saveBillEdit(id, d) {
  mutate(() => { const b = state.board.bills.find(x => x.id === id); if (b) { b.name = d.name.trim() || b.name; b.amount = d.amount || null; b.dueDay = d.dueDay || b.dueDay; b.autoPay = !!d.autoPay; } });
}
function deleteBill(id) { mutate(() => { state.board.bills = state.board.bills.filter(b => b.id !== id); }); }
function toggleBillPaid(id) {
  mutate(() => {
    const b = state.board.bills.find(x => x.id === id); if (!b) return;
    b.paid = b.paid || {};
    const mk = monthKeyOf(today0());
    if (b.paid[mk]) delete b.paid[mk]; else b.paid[mk] = { by: state.who || '', ts: Date.now() };
  });
}
function editBillName(id, text) {
  text = text.trim();
  mutate(() => { const b = state.board.bills.find(x => x.id === id); if (b && text) b.name = text; });
}
function renderBills() {
  const wrap = el('bills');
  const bills = [...state.board.bills].sort((a, b) => billNextOccurrence(a) - billNextOccurrence(b));
  let html = '';
  if (!bills.length) html = '<div class="empty-hint">No bills yet - add levy, WiFi, insurance...</div>';
  for (const b of bills) html += billRowHtml(b);
  wrap.innerHTML = html;
}
let editingBillId = null;
function openBillForm(bill) {
  editingBillId = bill ? bill.id : null;
  el('newBillForm').style.display = 'block'; el('newBillBtn').style.display = 'none';
  el('billName').value = bill ? bill.name : '';
  el('billAmount').value = bill && bill.amount ? bill.amount : '';
  el('billDay').value = bill ? bill.dueDay : '';
  el('billAuto').checked = bill ? !!bill.autoPay : false;
  el('saveBillBtn').textContent = bill ? 'Save' : 'Add';
  el('billName').focus();
}
function billClick(e) {
  const t = e.target;
  if (t.dataset.billpay) { toggleBillPaid(t.dataset.billpay); return; }
  if (t.dataset.billdel) { const b = state.board.bills.find(x => x.id === t.dataset.billdel); if (b && confirm('Delete bill "' + b.name + '"?')) deleteBill(b.id); return; }
  if (t.dataset.billform) { const b = state.board.bills.find(x => x.id === t.dataset.billform); if (b) openBillForm(b); return; }
  if (t.dataset.billedit) {
    const b = state.board.bills.find(x => x.id === t.dataset.billedit);
    const input = document.createElement('input');
    input.className = 'item-text-input'; input.value = b.name;
    const commit = () => { editBillName(b.id, input.value); if (renderDeferred) render(); };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev2 => { if (ev2.key === 'Enter') input.blur(); if (ev2.key === 'Escape') { input.value = b.name; input.blur(); } });
    t.replaceWith(input); input.focus();
    return;
  }
}
el('bills').addEventListener('click', billClick);
el('newBillBtn').addEventListener('click', () => openBillForm(null));
el('cancelBillBtn').addEventListener('click', () => {
  el('newBillForm').style.display = 'none'; el('newBillBtn').style.display = 'block';
  el('billName').value = ''; el('billAmount').value = ''; el('billDay').value = '';
});
el('saveBillBtn').addEventListener('click', () => {
  const name = el('billName').value.trim();
  const day = parseInt(el('billDay').value, 10);
  if (!name || !(day >= 1 && day <= 31)) return;
  const amount = parseFloat(el('billAmount').value) || null;
  const autoPay = el('billAuto').checked;
  if (editingBillId) saveBillEdit(editingBillId, {name, amount, dueDay: day, autoPay});
  else addBill({name, amount, dueDay: day, autoPay});
  el('billName').value = ''; el('billAmount').value = ''; el('billDay').value = '';
  el('newBillForm').style.display = 'none'; el('newBillBtn').style.display = 'block';
});

/* ---------- meals ---------- */
const MEAL_DAYS = [['mon','Monday'],['tue','Tuesday'],['wed','Wednesday'],['thu','Thursday'],['fri','Friday']];
function setMeal(day, kind, text) {
  mutate(() => { const m = state.board.meals[day]; if (m) m[kind] = text.trim(); });
}
function renderMeals() {
  const todayDow = ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];
  let html = '<div class="meal-table">';
  html += '<div></div><div class="mt-head">\ud83e\udd57 Lunch</div><div class="mt-head">\ud83c\udf7d Dinner</div>';
  for (const pair of MEAL_DAYS) {
    const k = pair[0], label = pair[1];
    const m = state.board.meals[k] || { lunch: '', dinner: '' };
    html += '<div class="mt-day' + (k === todayDow ? ' today' : '') + '">' + label.slice(0, 3) + '</div>';
    html += '<input class="mt-input item-text-input" data-mday="' + k + '" data-mkind="lunch" placeholder="-" value="' + esc(m.lunch || '') + '" enterkeyhint="done">';
    html += '<input class="mt-input item-text-input" data-mday="' + k + '" data-mkind="dinner" placeholder="-" value="' + esc(m.dinner || '') + '" enterkeyhint="done">';
  }
  html += '</div>';
  el('meals').innerHTML = html;
}
el('meals').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.mday) setMeal(t.dataset.mday, t.dataset.mkind, t.value);
});
el('meals').addEventListener('keydown', e => {
  if (e.target.dataset && e.target.dataset.mday && e.key === 'Enter') e.target.blur();
});
let mpSrc = null, mpSel = [];
function renderMealPicker() {
  const p = el('mealPicker');
  if (!mpSrc) { p.style.display = 'none'; p.innerHTML = ''; return; }
  const dayName = MEAL_DAYS.filter(d => d[0] === mpSrc.day)[0][1].slice(0, 3);
  let html = '<span>Add ' + dayName + ' ' + mpSrc.kind + ' to:</span>';
  for (const pair of MEAL_DAYS) {
    if (pair[0] === mpSrc.day) continue;
    html += '<button class="mp-chip' + (mpSel.indexOf(pair[0]) >= 0 ? ' sel' : '') + '" data-mpday="' + pair[0] + '">' + pair[1].slice(0, 3) + '</button>';
  }
  html += '<button class="mp-apply" data-mpapply="1"' + (mpSel.length ? '' : ' disabled') + '>Add</button>';
  p.innerHTML = html; p.style.display = 'flex';
}
el('meals').addEventListener('focusin', e => {
  const t = e.target;
  if (t.dataset && t.dataset.mday) {
    if (!mpSrc || mpSrc.day !== t.dataset.mday || mpSrc.kind !== t.dataset.mkind) { mpSel = []; }
    mpSrc = { day: t.dataset.mday, kind: t.dataset.mkind };
    renderMealPicker();
  }
});
el('mealPicker').addEventListener('click', e => {
  const chip = e.target.closest('[data-mpday]');
  if (chip) {
    const d = chip.dataset.mpday, i = mpSel.indexOf(d);
    if (i >= 0) mpSel.splice(i, 1); else mpSel.push(d);
    renderMealPicker(); return;
  }
  if (e.target.closest('[data-mpapply]') && mpSrc && mpSel.length) {
    const src = mpSrc, days = mpSel.slice();
    mutate(() => {
      const meals = state.board.meals, val = ((meals[src.day] || {})[src.kind] || '').trim();
      if (val) days.forEach(d => { if (meals[d]) meals[d][src.kind] = val; });
    });
    mpSrc = null; mpSel = []; renderMealPicker();
  }
});

let clearArmTimer = null;
el('clearMealsBtn').addEventListener('click', () => {
  const b = el('clearMealsBtn');
  if (!b.classList.contains('armed')) {
    b.classList.add('armed');
    b.textContent = 'Tap again to clear the whole week';
    clearArmTimer = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Clear week'; }, 4000);
    return;
  }
  clearTimeout(clearArmTimer);
  mutate(() => { Object.keys(state.board.meals).forEach(k => { state.board.meals[k] = { lunch: '', dinner: '' }; }); });
  b.classList.remove('armed'); b.textContent = 'Clear week';
});

/* ---------- new list form ---------- */
let pickedColor = COLORS[0];
function renderSwatches() {
  el('swatches').innerHTML = COLORS.map(c => '<div class="swatch' + (c === pickedColor ? ' sel' : '') + '" data-color="' + c + '" style="background:' + c + '"></div>').join('');
}
el('newListBtn').addEventListener('click', () => { el('newListForm').style.display = 'block'; el('newListBtn').style.display = 'none'; renderSwatches(); el('newListName').focus(); });
el('cancelListBtn').addEventListener('click', () => { el('newListForm').style.display = 'none'; el('newListBtn').style.display = 'block'; el('newListName').value = ''; });
el('createListBtn').addEventListener('click', () => {
  addList(el('newListName').value, pickedColor);
  el('newListName').value = ''; el('newListForm').style.display = 'none'; el('newListBtn').style.display = 'block';
});
el('swatches').addEventListener('click', e => { if (e.target.dataset.color) { pickedColor = e.target.dataset.color; renderSwatches(); } });

/* ---------- who ---------- */
function askWho() {
  el('whoOverlay').style.display = 'flex';
  const done = name => {
    name = (name || '').trim() || 'Someone';
    state.who = name; saveLocal(); el('whoOverlay').style.display = 'none'; render(); pull(true);
  };
  el('whoGreg').onclick = () => done('Greg');
  el('whoJade').onclick = () => done('Jade');
}

/* ---------- boot ---------- */
function boot() {
  const local = loadLocal();
  state = local && local.board ? {board: local.board, version: local.version || 0, who: local.who || null, open: {}} : null;
  if (!state) state = {board: null, version: 0, who: null, open: {}};
  state.view = 'lists';
  const _now = new Date();
  state.calY = _now.getFullYear(); state.calM = _now.getMonth(); state.calSel = null;
  if (!state.board) {
    // try server first; if server empty or unreachable, seed locally
    state.board = seedBoard(); state._fresh = true;
  }
  state.board.lists.forEach((l,i) => { if (!(l.id in state.open)) state.open[l.id] = true; });
  ensureEvents(); ensureBills(); ensureMeals();
  render();
  if (API_URL) {
    pull(true).then(() => {
      if (state._fresh && state.version === 0) { delete state._fresh; saveLocal(); schedulePush(); }
    });
  } else setSync('local','this phone only');
  if (!state.who) askWho();
}
boot();

/* ---------- self test hook (for automated verification) ---------- */
if (location.search.indexOf('selftest') >= 0) {
  setTimeout(() => {
    try {
      const out = [];
      const g = state.board.lists[0];
      addItem(g.id, 'SELFTEST milk'); out.push('add:' + (findList(g.id).items.some(i => i.text === 'SELFTEST milk')));
      const it = findList(g.id).items.find(i => i.text === 'SELFTEST milk');
      toggleItem(g.id, it.id); out.push('toggle:' + (it.done === true));
      setItemDate(g.id, it.id, '2026-12-25'); out.push('date:' + (it.date === '2026-12-25'));
      addList('SELFTEST list', '#ffab40');
      out.push('list:' + state.board.lists.some(l => l.name === 'SELFTEST list'));
      const nl = state.board.lists.find(l => l.name === 'SELFTEST list');
      deleteList(nl.id); // confirm() blocked in headless; override
      document.title = 'SELFTEST ' + out.join(' ');
      const m = document.createElement('div'); m.id = 'selftest-result'; m.textContent = document.title;
      document.body.appendChild(m);
    } catch(e) { document.title = 'SELFTEST-FAIL ' + e.message; }
  }, 1200);
}
if (location.search.indexOf('synccheck=') >= 0) {
  const want = decodeURIComponent(location.search.split('synccheck=')[1].split('&')[0]);
  let tries = 0;
  const iv = setInterval(() => {
    tries++;
    const found = state.board.lists.some(l => l.items.some(i => i.text === want));
    if (found || tries > 20) {
      clearInterval(iv);
      document.title = found ? 'SYNCCHECK-PASS' : 'SYNCCHECK-FAIL';
      const m = document.createElement('div'); m.id = 'selftest-result'; m.textContent = document.title + ' v' + state.version;
      document.body.appendChild(m);
    } else pull(true);
  }, 1000);
}
</script>
